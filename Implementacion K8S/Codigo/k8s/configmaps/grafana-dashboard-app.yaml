# Generado a partir de la definición del dashboard. JSON indentado para que los cambios
# se puedan revisar en un diff. Grafana lo carga por provisioning (ver grafana-deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app
  namespace: pharmago
data:
  pharmago-app.json: |
    {
      "title": "PharmaGo - Negocio y Runtime",
      "uid": "pharmago-app",
      "tags": [
        "pharmago",
        "negocio",
        "runtime"
      ],
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "editable": true,
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Negocio",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Logins por minuto (por resultado)",
          "description": "Base de la alerta 'Logins fallidos anómalos'.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (outcome) (rate(pharmago_logins_total{job=\"otlp-collector\"}[5m])) * 60",
              "legendFormat": "{{outcome}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "% de logins fallidos",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(pharmago_logins_total{job=\"otlp-collector\", outcome=\"failed\"}[5m])) / sum(rate(pharmago_logins_total{job=\"otlp-collector\"}[5m])) * 100",
              "legendFormat": "fallidos",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },

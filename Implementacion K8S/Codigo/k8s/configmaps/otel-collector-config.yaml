apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: pharmago
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
      debug:
        verbosity: basic

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [prometheus, debug]
        traces:
          receivers: [otlp]
          exporters: [debug]

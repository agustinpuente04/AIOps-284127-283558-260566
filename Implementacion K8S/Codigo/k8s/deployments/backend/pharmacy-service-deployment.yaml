apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-pharmacy-service
  namespace: pharmago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharmago-pharmacy-service
  template:
    metadata:
      labels:
        app: pharmago-pharmacy-service
        pharmago.io/tier: microservice
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [backend, all]
        # Regla de despliegue: dos microservicios distintos nunca comparten nodo físico.
        # Se excluye la propia app para que el RollingUpdate pueda levantar el pod nuevo
        # en el mismo nodo que el viejo sin quedar Pending.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: pharmago.io/tier
                operator: In
                values: [microservice]
              - key: app
                operator: NotIn
                values: [pharmago-pharmacy-service]
            topologyKey: kubernetes.io/hostname
      containers:
      - name: pharmago-pharmacy-service
        image: pharmago-pharmacy-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Server=pharmago-db;Database=PharmaDb;User Id=sa;Password=Str0ngP@ssword!"
        - name: ServiceUrls__UsersService
          value: "http://pharmago-users-service:80"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: Logging__LogLevel__Microsoft.EntityFrameworkCore
          value: "None"
        - name: Logging__LogLevel__Microsoft.Data.SqlClient
          value: "None"
        # Recursos reducidos para nodos ~5GB (proyecto docente)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 7
          timeoutSeconds: 3
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3

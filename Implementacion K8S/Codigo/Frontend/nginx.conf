server {
  listen       80;
  server_name  localhost 127.0.0.1;
  root   /usr/share/nginx/html;
  index  index.html;

  # Keep-alive corto (< preStop de 10s): las conexiones ociosas de los navegadores
  # hacia un pod que se está reemplazando se cierran antes de que nginx termine.
  keepalive_timeout 5s;

  # Punto de entrada único: la UI hace de proxy hacia el API Gateway a través de su
  # Service de Kubernetes (balancea entre réplicas y sobrevive al reemplazo de pods).
  location /api/ {
    proxy_pass http://pharmago-api-gateway:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # El gateway aplica rate limiting y lee la IP real del cliente de X-Forwarded-For, que añade nginx con $remote_addr.
    # Solo confía en esa cabecera si quien se conecta es un pod de nginx (Service headless pharmago-ui-pods).
    # X-Real-IP se conserva por compatibilidad, pero el gateway ya no la usa.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
